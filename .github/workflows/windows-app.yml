name: Build Windows app
on:
  push:
    paths: ['timetable/**', '.github/workflows/windows-app.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: timetable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: DigitalTimetable-Windows
          path: |
            timetable/dist/*.exe
