<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منظم الجدول المدرسي</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0f5e6e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1d2730;--mute:#5d6b78;--line:#d7dee5;--pri:#0f5e6e;--pri2:#e3f1f3;--warn:#b54708;--bad:#b42318;--ok:#067647;--sel:#fde68a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171c;--card:#1a232a;--ink:#e6edf2;--mute:#9aa8b4;--line:#2d3a44;--pri:#4fb3c4;--pri2:#173740;--sel:#6b5a12}}
:root[data-theme="dark"]{--bg:#11171c;--card:#1a232a;--ink:#e6edf2;--mute:#9aa8b4;--line:#2d3a44;--pri:#4fb3c4;--pri2:#173740;--sel:#6b5a12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:15px}
header.top{background:var(--pri);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top h1{font-size:18px;margin:0;flex:1}
header.top img{height:36px;border-radius:6px;background:#fff}
nav.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);padding:0 8px;position:sticky;top:0;z-index:5}
nav.tabs button{border:0;background:none;padding:12px 14px;font:inherit;color:var(--mute);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs button.on{color:var(--pri);border-color:var(--pri);font-weight:700}
main{padding:16px;max-width:1400px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
input[type=checkbox]{width:auto}
.btn{border:1px solid var(--pri);background:var(--pri);color:#fff;padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn.o{background:transparent;color:var(--pri)}
.btn.r{background:var(--bad);border-color:var(--bad)}
.btn.s{padding:4px 9px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scroll{overflow-x:auto;max-width:100%}
table.t{border-collapse:collapse;width:100%}
table.t th,table.t td{border:1px solid var(--line);padding:6px;text-align:center}
table.t th{background:var(--pri2)}
.mute{color:var(--mute);font-size:13px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--pri2);font-size:12px}
.warn{color:var(--warn)}.bad{color:var(--bad)}.ok{color:var(--ok)}
#toast{position:fixed;bottom:16px;left:16px;right:16px;max-width:420px;margin:auto;background:#222;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:50}
.tt td.cell{min-width:78px;height:46px;cursor:pointer;font-size:13px;line-height:1.3}
.tt td.cell.sel{background:var(--sel)}
.tt td.cell.lock{outline:2px dashed var(--pri);outline-offset:-3px}
.tt td.cell small{color:var(--mute);display:block}
.unav{background:repeating-linear-gradient(45deg,transparent,transparent 4px,rgba(180,35,24,.15) 4px,rgba(180,35,24,.15) 8px)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:95vw;width:640px}
dialog::backdrop{background:rgba(0,0,0,.4)}
.chips span{display:inline-block;background:var(--pri2);border-radius:6px;padding:2px 6px;margin:2px;font-size:12px}
/* ======== print ======== */
#printArea{display:none}
.pv{background:#fff;color:#000;padding:8px;margin:auto}
.pv .page{page-break-after:always;break-after:page;padding:6px}
.pv .page:last-child{page-break-after:auto}
.pv .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.pv .ph img{height:60px}
.pv .ph .c{text-align:center;flex:1}
.pv .ph .c b{font-size:20px;display:block}
.pv .ph .s{font-size:12px;min-width:150px}
.pv table{border-collapse:collapse;width:100%;font-size:10px;table-layout:fixed}
.pv th,.pv td{border:1px solid #000;padding:1px 2px;text-align:center;height:16px;overflow:hidden;white-space:nowrap}
.pv th{background:#d9e7ec}
.pv .day{background:#bcd5dd;font-weight:800}
.pv td.dep{background:#eef3f5;font-weight:700;white-space:normal;writing-mode:horizontal-tb}
.pv td.nm{text-align:right;white-space:nowrap}
.pv .cls table{font-size:15px}.pv .cls td,.pv .cls th{height:56px}
.pv .cls td small{display:block;font-size:10px;color:#333}
.pv .dthick{border-left:2.5px solid #000}
.pv .sm td{font-size:9px}
@media print{
  body{background:#fff}
  header.top,nav.tabs,main,#toast{display:none!important}
  #printArea{display:block}
  .pv{padding:0}
}
</style>
</head>
<body>
<header class="top"><img id="hLogo" alt="" hidden><h1 id="hTitle">منظم الجدول المدرسي</h1><span id="hYear" class="pill" style="background:rgba(255,255,255,.2)"></span></header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div id="printArea"></div>
<div id="toast"></div>
<dialog id="dlg"><div id="dlgBody"></div></dialog>
<script src="app.js"></script>
</body>
</html>
